name: Tests

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
        - python-version: "3.10"
          tox-env: py3.10
        - python-version: "3.11"
          tox-env: py3.11
        - python-version: "3.12"
          tox-env: py3.12
        - python-version: "3.13"
          tox-env: py3.13
        - python-version: "3.14"
          tox-env: py3.14
        - python-version: "pypy-3.11"
          tox-env: pypy3.11
        - python-version: "pypy-3.12"
          tox-env: pypy3.12
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install dependencies
      run: |
        python -m pip install tox coveralls
        python -m pip freeze
    - name: Test with pytest
      run: |
        tox -e ${{ matrix.tox-env }}
    - name: Upload coverage data
      run: |
        coveralls --service=github
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        COVERALLS_FLAG_NAME: ${{ matrix.test-name }}
        COVERALLS_PARALLEL: true
  coveralls:
    name: Indicate completion to coveralls.io
    needs: test
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version-file: .python-version
    - name: Finished
      run: |
        python -m pip install coveralls
        coveralls --service=github --finish
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
  check_packaging:
    runs-on: ubuntu-slim
    steps:
    - uses: actions/checkout@v3
    - name: Set up Python
      uses: actions/setup-python@v4
      with:
        python-version-file: .python-version
    - name: Verify packaging
      run: |
        python -m pip install build twine
        python -m build
        twine check dist/*
